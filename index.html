<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#efe7d2">
  <link rel="icon" href="data:,">
  <title>水源市場　周邊地圖</title>
  <meta name="description" content="水源市場周邊的立體地圖：可以旋轉、縮放，切換人流、車流、建築高度與步行圈。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/atlas.css?v=11">
</head>
<body>

  <!-- 純地圖：沒有相機、定位與血量，只有一張可以轉動的立體圖 -->
  <main id="atlas">
    <!-- 天空：太陽、月亮、雲、星星，畫在地圖後面 -->
    <div id="atlas-sky">
      <i class="star" style="left:12%;top:14%"></i><i class="star" style="left:31%;top:8%"></i><i class="star" style="left:58%;top:12%"></i>
      <i class="star" style="left:77%;top:20%"></i><i class="star" style="left:88%;top:9%"></i><i class="star" style="left:44%;top:22%"></i>
      <svg id="sky-sun" viewBox="-60 -60 120 120">
        <g stroke="#4a3b30" stroke-width="5" stroke-linecap="round">
          <path d="M0-52V-40M0 52V40M-52 0H-40M52 0H40M-37-37l8 8M37 37l-8-8M-37 37l8-8M37-37l-8 8"/>
        </g>
        <circle r="30" fill="#ffd23f" stroke="#4a3b30" stroke-width="3"/>
        <circle cx="-10" cy="-4" r="3.2" fill="#4a3b30"/><circle cx="10" cy="-4" r="3.2" fill="#4a3b30"/>
        <path d="M-8 7q8 8 16 0" fill="none" stroke="#4a3b30" stroke-width="3" stroke-linecap="round"/>
        <circle cx="-18" cy="6" r="5" fill="#ff8fa8" opacity=".75"/><circle cx="18" cy="6" r="5" fill="#ff8fa8" opacity=".75"/>
      </svg>
      <svg id="sky-moon" viewBox="-60 -60 120 120">
        <path d="M14-38a40 40 0 1 0 24 62a32 32 0 1 1-24-62z" fill="#fff1b8" stroke="#4a3b30" stroke-width="3" stroke-linejoin="round"/>
        <path d="M-14-4q5-5 10 0" fill="none" stroke="#4a3b30" stroke-width="3" stroke-linecap="round"/>
        <path d="M-12 10q6 6 12 0" fill="none" stroke="#4a3b30" stroke-width="3" stroke-linecap="round"/>
        <circle cx="-20" cy="6" r="4.5" fill="#ff8fa8" opacity=".75"/>
      </svg>
      <svg id="sky-cloud" viewBox="-70 -40 140 80">
        <path d="M-44 24a18 18 0 0 1 2-36a24 24 0 0 1 44-8a20 20 0 0 1 34 12a16 16 0 0 1 2 32z" fill="#fbfaf6" stroke="#4a3b30" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="-10" cy="4" r="2.8" fill="#4a3b30"/><circle cx="12" cy="4" r="2.8" fill="#4a3b30"/>
        <path d="M-3 11q4 4 8 0" fill="none" stroke="#4a3b30" stroke-width="2.6" stroke-linecap="round"/>
      </svg>
    </div>
    <canvas id="atlas-gl"></canvas>
    <div id="atlas-rain"></div>
    <div id="atlas-tags"></div>

    <header id="atlas-head">
      <p id="atlas-place"></p>
      <h1 id="atlas-name"></h1>
      <p id="atlas-name-en"></p>
      <p id="atlas-sub"></p>
    </header>
    <nav id="atlas-tools">
      <button id="atlas-floor-btn">樓層測繪圖</button>
      <button id="atlas-top">俯視</button>
      <button id="atlas-set">時間・天氣</button>
      <button id="atlas-home">回到全圖</button>
    </nav>

    <!-- 設定：時間、天氣、調色 -->
    <aside id="atlas-panel" hidden>
      <button id="set-close" aria-label="關閉">✕</button>
      <h2>時間與天氣 <b id="set-clock"></b></h2>
      <input id="set-time" type="range" min="0" max="23.75" step="0.25">
      <div id="set-weather"></div>
      <button id="set-now">回到現在的時間</button>
    </aside>

    <!-- Render 的成品：先給人看，再存檔 -->
    <aside id="atlas-shot" hidden>
      <div class="shot-box">
        <img id="shot-img" alt="輸出的圖">
        <div class="shot-bar">
          <span id="shot-size"></span>
          <a id="shot-save" class="shot-main">下載 PNG</a>
          <a id="shot-open" target="_blank" rel="noopener">在新分頁開啟</a>
          <button id="shot-close">關閉</button>
        </div>
        <p class="shot-tip">下載沒反應的話，在圖上按右鍵（手機長按）選「另存圖片」。</p>
      </div>
    </aside>

    <!-- 測繪圖：圖上每一層拉一條黑線寫用途，點文字可以展開那一層 -->
    <div id="survey-tags"></div>

    <!-- 資料來源 -->
    <aside id="atlas-sources" hidden>
      <button id="src-close" aria-label="關閉">✕</button>
      <h2>資料來源</h2>
      <ul id="src-list"></ul>
    </aside>

    <footer id="atlas-foot">
      <p id="lens-note" hidden></p>
      <nav id="atlas-lens"></nav>
      <p id="atlas-meta"><span class="hint-touch">單指旋轉　·　雙指縮放與移動　·　點水源市場看樓層</span><span class="hint-key">拖曳旋轉　·　滾輪縮放　·　WASD 移動　·　Q / E 旋轉　·　點水源市場看樓層　·　Esc 隱藏文字</span><span><span id="atlas-count"></span>　<button id="atlas-src">資料來源</button></span></p>
    </footer>
  </main>

  <script src="vendor/three.min.js"></script>
  <script src="data/atlas.js"></script>
  <!-- 這兩個檔案常改，加上時間戳記，免得瀏覽器拿到舊的 -->
  <script>document.write('<script src="data/site.js?t=' + Date.now() + '"><\/script><script src="data/style.js?t=' + Date.now() + '"><\/script>');</script>
  <script src="js/atlas.js?v=11"></script>
</body>
</html>
